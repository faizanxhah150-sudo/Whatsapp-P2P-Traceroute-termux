[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-ip-tracker"
version = "1.1.1"
description = "Authorized/educational WhatsApp (Meta) network traffic analyzer with geo/ASN enrichment and a live dashboard. Runs natively on rooted Android (Termux), Linux and Windows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5,<3",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "maxminddb>=2.2,<4",
]

[project.optional-dependencies]
dashboard = [
    "starlette>=0.37,<2",
    "uvicorn>=0.29,<1",
    "websockets>=12,<16",
]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.5",
]

[project.scripts]
wit = "main:main"

[tool.setuptools]
py-modules = ["main", "config"]
packages = ["core", "utils", "dashboard"]

[tool.setuptools.package-data]
dashboard = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]
